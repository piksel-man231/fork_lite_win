[package]
name = "fork-lite-win"
version = "0.5.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ForkLiteWin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
arboard = "3"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }
ureq = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"

[build-dependencies]
embed-manifest = "1.5"
embed-resource = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
