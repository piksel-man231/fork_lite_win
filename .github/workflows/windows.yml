name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test application logic
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Download Windows engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin, vendor | Out-Null
          Invoke-WebRequest 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile vendor/sing-box.zip
          Invoke-WebRequest 'https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-windows-64.zip' -OutFile vendor/xray.zip
          Expand-Archive vendor/sing-box.zip vendor/sing
          Expand-Archive vendor/xray.zip vendor/xray
          Copy-Item vendor/sing/sing-box-1.14.4-windows-amd64/sing-box.exe bin/
          Copy-Item vendor/sing/sing-box-1.14.4-windows-amd64/libcronet.dll bin/
          Copy-Item vendor/xray/xray.exe bin/
          Copy-Item vendor/xray/wintun.dll bin/
      - name: Build executable
        shell: pwsh
        run: .\build.ps1
      - name: Check packaged engines and configuration
        shell: pwsh
        run: .\dist\ForkLiteWin.exe --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ForkLiteWin-windows-x64
          path: dist/ForkLiteWin.exe
          if-no-files-found: error
